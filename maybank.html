<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two-page UI prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fdfdfd;color:#090909;font-family:Poppins,"Century Gothic",Arial,sans-serif}
[hidden]{display:none!important}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #205fbd;outline-offset:3px}
.editor{max-width:620px;margin:28px auto;padding:24px}
.editor h1{margin:0 0 8px;font-size:26px}
.editor p{margin:0 0 20px;color:#50535a}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px 16px}
.fields label{display:grid;gap:4px;font-size:14px;font-weight:600}
.fields input{width:100%;padding:9px;border:1px solid #888c95;border-radius:8px;background:white;color:#090909}
.show{margin-top:22px;border:0;border-radius:30px;padding:12px 24px;background:#18783a;color:white;font-weight:700}
.sheet{width:min(100%,945px);aspect-ratio:945/2048;margin:auto;position:relative;container-type:inline-size}
.panel{position:absolute;left:13.39%;top:11.23%;width:69.42%;height:59.96%;background:#ececf1}
.mark{position:absolute;left:8.69%;top:14.41%;width:13.42%;height:6.84%;background:#ffc600;border:1px solid #edc600;border-radius:50%;display:grid;place-items:center}
.mark svg{width:60%;height:60%}
.pos{position:absolute;margin:0;line-height:1.12;overflow-wrap:anywhere;max-width:83%}
.t1{left:8.06%;top:25.45%;font-size:4.02cqw;font-weight:400}
.divider{position:absolute;left:6.9%;top:41.29%;width:23%;height:1px;background:#ececf1}
.t2{left:8.38%;top:42.07%;font:700 4.65cqw/1.12 Arial,sans-serif}
.t9{left:9%;top:49.08%;font-size:3.2cqw;letter-spacing:0.05em}
.label{left:8.35%;font-size:2.28cqw;color:#858585;max-width:42%}
.value{right:7.35%;text-align:right;font-size:2.17cqw;font-weight:700;max-width:56%}
.r1{top:57.66%}.r2{top:62.6%}.r3{top:67.5%}
.value.r1,.value.r3{transform:translateY(-.55cqw)}
.t3,.done{position:absolute;left:6.1%;width:87.8%;height:6.2%;border-radius:999px;display:grid;place-items:center;padding:0 4%;text-align:center;overflow-wrap:anywhere}
.t3{top:77.93%;border:1.5px solid #ccc;background:#fdfdfd;font-size:2.8cqw;font-weight:700}
.done{top:85.4%;border:0;background:#ffc600;color:#0b0b0b;font-size:2.51cqw;font-weight:600}
.disclaimer{position:absolute;top:94%;left:0;width:100%;padding:0 12px;margin:0;text-align:center;color:#484850;font-size:clamp(10px,1.5cqw,15px);font-weight:700;letter-spacing:.055em}
/* Phone layout: edge-to-edge, with scrolling on very short screens. */
@media (max-width:600px){
  .sheet{width:100%;height:100vh;height:100dvh;min-height:520px;aspect-ratio:auto}
  .panel{inset:0;width:100%;height:100%}
  .mark{height:auto;aspect-ratio:1}
  .fields input{font-size:16px}
}
</style>
</head>
<body>
<main>
<section class="editor" id="editor" aria-labelledby="heading">
  <h1 id="heading">Edit preview text</h1>
  <p>Change Text 1 through Text 9, then preview the layout. The preview uses your device’s current date and time. This prototype does not process payments.</p>
  <form id="form"><div class="fields" id="fields"></div><button class="show" type="submit">Preview</button></form>
</section>
<section class="sheet" id="preview" hidden aria-label="Prototype preview">
  <div class="panel">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 60 50"><path d="M5 25l15 14L55 10" fill="none" stroke="#f5c300" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 25l15 14L55 10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2 class="pos t1" data-out="1"></h2>
    <div class="divider" aria-hidden="true"></div>
    <p class="pos t2" data-out="2"></p><p class="pos t9" data-out="9"></p>
    <p class="pos label r1" data-out="8"></p><p class="pos value r1" data-out="4"></p>
    <p class="pos label r2" data-out="7"></p><p class="pos value r2" id="stamp"></p>
    <p class="pos label r3" data-out="6"></p><p class="pos value r3" data-out="5"></p>
    <div class="t3" data-out="3"></div><button class="done" type="button" id="done">Done</button>
    <p class="disclaimer"></p>
  </div>
</section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const defaults = ['Payment successful','RM 100.00','Share Receipt','9476554582Q','Scan & Pay','Transaction Type','Date & time','Reference ID','Name'];
  const addField = (title, value, limit) => {
    const label = document.createElement('label');
    label.textContent = title;
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = limit;
    input.value = value;
    label.append(input);
    $('fields').append(label);
    return input;
  };
  const inputs = defaults.map((value, i) => addField('Text ' + (i + 1), value, i === 1 ? 24 : 32));
  const dateFormat = new Intl.DateTimeFormat('en-GB', {day:'numeric', month:'short', year:'numeric'});
  const timeFormat = new Intl.DateTimeFormat('en-US', {hour:'numeric', minute:'2-digit', hour12:true});
  function deviceTimestamp() {
    const now = new Date();
    return dateFormat.format(now) + ', ' + timeFormat.format(now);
  }
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    document.querySelectorAll('[data-out]').forEach(el => {
      el.textContent = inputs[Number(el.dataset.out) - 1].value;
    });
    $('stamp').textContent = deviceTimestamp();
    $('editor').hidden = true;
    $('preview').hidden = false;
    $('done').focus({preventScroll:true});
    window.scrollTo(0,0);
  });
  $('done').addEventListener('click', () => {
    $('preview').hidden = true;
    $('editor').hidden = false;
    inputs[0].focus({preventScroll:true});
    window.scrollTo(0,0);
  });
})();
</script>
</body>
</html>
