<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Responses</title>
<style>
  :root {
    --accent: #2f6f4f;
    --accent-dark: #234f38;
    --bg: #f4f1ea;
    --card-bg: #ffffff;
    --text: #2a2a2a;
    --muted: #6b6b6b;
    --border: #e0ddd3;
    --row-alt: #faf9f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 28px 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    color: var(--accent-dark);
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 0.9rem;
  }
  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 24px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    min-width: 700px;
  }
  thead th {
    text-align: left;
    background: var(--accent);
    color: #fff;
    padding: 10px 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:last-child td { border-bottom: none; }
  .empty-note {
    padding: 20px 12px;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>RSVP Responses</h1>
  <p class="subtitle">This page updates automatically every time someone submits the RSVP form. Do not edit it by hand — save.php rewrites it on each submission.</p>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Name</th>
          <th>Attending</th>
          <th>Guests</th>
          <th>Contact</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody>
        <!-- RSVP_ROWS -->
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
