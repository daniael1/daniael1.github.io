<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24465C">
<title>SMT Compactor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --floor: #EEF1F2;
  --steel: #DCE2E5;
  --steel-2: #C9D2D7;
  --edge: #8E9CA5;
  --panel: #24465C;
  --panel-2: #2F5A75;
  --tape: #F5CF3A;
  --tape-ink: #2A2300;
  --ink: #22303A;
  --muted: #5B6871;
  --line: #CDD5DA;
  --white: #FFFFFF;
  --ok: #2E8B57;
  --low: #B97A00;
  --out: #C8372D;
  --order: #3767C2;
  --nc: #8A969E;
  --focus: #E0A800;
  --tabbar: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --cond: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px; line-height: 1.4; color: var(--ink); background: var(--floor);
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
mark { background: #FBE7A1; color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---------- shell ---------- */
#view { min-height: 100%; padding-bottom: calc(var(--tabbar) + var(--safe-b) + 16px); }
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--panel); color: var(--white);
  padding: calc(10px + var(--safe-t)) 16px 12px;
}
.topbar-row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.topbar h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: .005em; flex: 1; min-width: 0; }
.topbar .sub { font-size: 14px; color: #BFD0DB; margin: 0; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 8px; flex: none;
}
.topbar .icon-btn { color: var(--white); }
.topbar .icon-btn:active { background: rgba(255,255,255,.12); }
.icon-btn svg { width: 24px; height: 24px; }
.searchbox {
  display: flex; align-items: center; gap: 8px; margin-top: 10px; background: var(--white); color: var(--ink);
  border-radius: 8px; padding: 0 12px; min-height: 48px; width: 100%; text-align: left;
}
.searchbox svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.searchbox input { border: 0; outline: 0; flex: 1; min-width: 0; font-size: 17px; background: transparent; height: 46px; }
.searchbox .ph { color: var(--muted); font-size: 16px; }
.searchbox .clear { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--panel);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: var(--safe-b); height: calc(var(--tabbar) + var(--safe-b));
}
.tabbar button {
  color: #AFC3D0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 13px; font-weight: 500; position: relative;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--white); }
.tabbar button[aria-current="page"]::before {
  content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 4px; background: var(--tape); border-radius: 0 0 3px 3px;
}

.wrap { padding: 16px; max-width: 1100px; margin: 0 auto; }
.section-title { font-size: 15px; font-weight: 600; color: var(--muted); margin: 14px 0 10px; }
.section-title:first-child { margin-top: 4px; }

/* ---------- label-maker tape ---------- */
.tape {
  display: inline-block; background: var(--tape); color: var(--tape-ink);
  font-family: var(--cond); font-weight: 700; font-size: 14px; line-height: 1.25; letter-spacing: .02em;
  padding: 1px 8px; white-space: nowrap;
  clip-path: polygon(0 0, 100% 0, calc(100% - 3px) 50%, 100% 100%, 0 100%, 3px 50%);
}
.tape.big { font-size: 20px; padding: 2px 12px; }
.tape.small { font-size: 12.5px; padding: 0 6px; }

/* ---------- status ---------- */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.st::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.st-ok { color: var(--ok); } .st-low { color: var(--low); } .st-out { color: var(--out); }
.st-order { color: var(--order); } .st-nc { color: var(--nc); }

/* ---------- home: alert strip + rack end panels ---------- */
.alerts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.alert-chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 20px;
  background: var(--white); border: 1px solid var(--line); font-size: 15px; font-weight: 500;
}
.alert-chip b { font-weight: 700; }
.racks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 10px; }
@media (min-width: 640px) { .racks { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .racks { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px 6px; } }
.endpanel {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: var(--steel); border: 1px solid var(--edge); border-radius: 5px 5px 2px 2px;
  padding: 6px 6px 8px; min-height: 140px; text-align: center;
  box-shadow: inset 0 0 0 3px #E8ECEE, inset 4px 0 0 3px #CFD7DB;
}
.endpanel::after { /* floor rail feet */
  content: ''; position: absolute; left: 8px; right: 8px; bottom: -7px; height: 6px;
  background: linear-gradient(90deg, #56646D 0 22%, transparent 22% 78%, #56646D 78%); border-radius: 0 0 2px 2px;
}
.endpanel:active { transform: translateY(1px); }
.plate {
  background: var(--panel); color: var(--white); font-family: var(--cond); font-weight: 700; font-size: 28px; line-height: 1;
  min-width: 46px; padding: 6px 6px 5px; border-radius: 3px;
}
.wheel { width: 30px; height: 30px; color: #56646D; }
.shelves { width: 100%; display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
.shelf {
  height: 9px; border-bottom: 2px solid var(--edge); display: flex; justify-content: space-between; align-items: flex-end;
  font-family: var(--cond); font-size: 9.5px; line-height: 1; color: var(--muted); padding: 0 2px;
}
.shelf i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-bottom: 1px; }
.shelf i.out { background: var(--out); } .shelf i.low { background: var(--low); }
.endpanel .count { font-size: 13px; color: var(--muted); font-weight: 500; }
.endpanel .flag { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; }
.flag.out { background: var(--out); } .flag.low { background: var(--low); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 22px; font-size: 14px; color: var(--muted); }

/* ---------- rack view: cabinet with shelves and bins ---------- */
.rack-nav { display: flex; gap: 4px; }
.cabinet { background: var(--panel); border-radius: 6px; padding: 7px; }
.level { display: flex; gap: 6px; align-items: stretch; background: var(--steel); padding: 8px 6px 9px; border-bottom: 6px solid var(--edge); }
.level + .level { margin-top: 7px; }
.level-tag {
  flex: none; width: 28px; display: flex; align-items: center; justify-content: center;
  background: var(--tape); color: var(--tape-ink); font-family: var(--cond); font-weight: 700; font-size: 20px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 4px), 0 100%);
}
.bins { flex: 1; min-width: 0; display: flex; gap: 6px; }
.bin {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-align: left;
  background: #F8FAFB; border: 1px solid #AEB9C0; border-top: 3px solid #AEB9C0; border-radius: 2px 2px 4px 4px;
  padding: 6px 6px 6px; min-height: 104px; position: relative;
}
.bin:active { background: #FFF8DA; }
.bin.empty { background: transparent; border-style: dashed; color: var(--muted); justify-content: center; align-items: center; text-align: center; font-size: 13px; }
.bin .model {
  font-family: var(--cond); font-weight: 600; font-size: 14px; line-height: 1.15; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
}
/* narrow phones: give 4-box shelves more room */
@media (max-width: 430px) {
  .rack-wrap { padding-left: 8px; padding-right: 8px; }
  .cabinet { padding: 5px; }
  .level { padding: 7px 4px 8px; gap: 4px; }
  .level-tag { width: 22px; font-size: 17px; }
  .bins { gap: 4px; }
  .bins.n4 .bin { padding: 5px 4px; }
  .bins.n4 .bin .model { font-size: 12.5px; letter-spacing: -.01em; }
  .bins.n4 .tape.small { font-size: 11.5px; padding: 0 5px; }
  .bins.n4 .bin .n { font-size: 12px; }
}
.bin .n { margin-top: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.bin .n i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.bin .n i.out { background: var(--out); } .bin .n i.low { background: var(--low); } .bin .n i.order { background: var(--order); }
.comps { display: flex; gap: 2px; }
.comps span { flex: 1; min-width: 0; text-align: center; font-family: var(--cond); font-size: 11px; color: var(--muted); border-top: 2px solid var(--steel-2); }
.bin.pulse { animation: pulse 1s ease-in-out 2; border-color: #C9A200; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245,207,58,0); } 40% { box-shadow: 0 0 0 6px rgba(245,207,58,.95); background: #FFF6CC; } }
.view-enter { animation: roll .32s cubic-bezier(.2,.7,.2,1); }
@keyframes roll { from { transform: translateX(28%); opacity: .2; } to { transform: none; opacity: 1; } }
.rack-foot { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

/* ---------- lists ---------- */
.list { background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.wrap > .list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.item {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 0 12px; width: 100%; text-align: left;
  padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); align-items: start; position: relative;
}
.item:last-child { border-bottom: 0; }
.item:active { background: #F3F6F7; }
.item .bar { align-self: stretch; border-radius: 0 2px 2px 0; }
.bar.ok { background: var(--ok); } .bar.low { background: var(--low); } .bar.out { background: var(--out); }
.bar.order { background: var(--order); } .bar.nc { background: #C5CDD2; }
.item .desc { font-weight: 600; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.item .sub { font-size: 14px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.item .pn { font-weight: 600; color: var(--ink); letter-spacing: .01em; }
.item .right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.qty { font-family: var(--cond); font-weight: 700; font-size: 20px; line-height: 1; }
.qty small { font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 2px; }
.qty.none { color: var(--nc); font-size: 16px; }
.item.hl { background: #FFF6CC; }
.locate-btn {
  display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 10px; border-radius: 18px;
  background: var(--tape); color: var(--tape-ink); font-weight: 600; font-size: 14px;
}
.locate-btn svg { width: 16px; height: 16px; }
.group-h { padding: 10px 14px 6px; font-family: var(--cond); font-weight: 600; font-size: 15px; color: var(--muted); background: #F4F6F7; border-bottom: 1px solid var(--line); }

/* ---------- search ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--white);
  font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--panel); border-color: var(--panel); color: var(--white); }
.chip select { border: 0; background: transparent; font-weight: 500; outline: 0; }
.result-meta { padding: 8px 16px; font-size: 14px; color: var(--muted); }
.shortcut {
  display: flex; align-items: center; gap: 12px; width: calc(100% - 32px); margin: 8px 16px; padding: 12px 14px; text-align: left;
  background: var(--white); border: 1px solid var(--line); border-radius: 6px; font-weight: 500;
}
.empty-state { padding: 28px 20px; text-align: center; color: var(--muted); max-width: 420px; margin: 0 auto; }
.empty-state p { margin: 0 0 14px; }

/* ---------- buttons & forms ---------- */
.btn {
  min-height: 48px; padding: 0 18px; border-radius: 6px; font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent;
}
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--panel); color: var(--white); }
.btn.primary:disabled { background: #9FB0BB; }
.btn.yellow { background: var(--tape); color: var(--tape-ink); }
.btn.ghost { background: var(--white); border-color: var(--line); }
.btn.danger { color: var(--out); }
.btn.block { width: 100%; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.row-btns .btn { flex: 1 1 140px; }
.row-btns.stack { flex-direction: column; }
.row-btns.stack .btn { flex: none; width: 100%; justify-content: flex-start; }
.form { display: flex; flex-direction: column; gap: 18px; }
.field > .lbl, .lbl { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.lbl .opt { font-weight: 400; color: var(--muted); }
.input, .field input, .field select, .field textarea {
  width: 100%; min-height: 48px; border: 1px solid #AAB6BD; border-radius: 6px; background: var(--white);
  padding: 10px 12px; font-size: 16px;
}
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: 2px solid var(--panel-2); outline-offset: 0; border-color: var(--panel-2); }
.field.err input, .field.err textarea { border-color: var(--out); }
.err-msg { color: var(--out); font-size: 14px; margin-top: 6px; }
.warn { background: #FFF6CC; border: 1px solid #E8CF6B; border-radius: 6px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
.warn button { text-decoration: underline; font-weight: 600; }
.pick { display: grid; gap: 6px; }
.pick.racks6 { grid-template-columns: repeat(6, 1fr); }
.pick.five { grid-template-columns: repeat(5, 1fr); }
.pick.six { grid-template-columns: repeat(6, 1fr); }
.pick button {
  min-height: 46px; border: 1px solid #AAB6BD; border-radius: 6px; background: var(--white);
  font-family: var(--cond); font-weight: 700; font-size: 19px; position: relative;
}
.pick button.wide { font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 14px; }
.pick button[aria-pressed="true"] { background: var(--panel); color: var(--white); border-color: var(--panel); }
.pick button .dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.loc-preview { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--white); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper { display: flex; align-items: stretch; gap: 8px; }
.stepper button {
  width: 56px; min-height: 56px; border-radius: 8px; background: var(--steel); font-size: 28px; font-weight: 500; flex: none;
  border: 1px solid #B8C3C9;
}
.stepper button:active { background: var(--steel-2); }
.stepper input { flex: 1; min-width: 0; text-align: center; font-family: var(--cond); font-weight: 700; font-size: 28px; border: 1px solid #AAB6BD; border-radius: 8px; }
.stepper select { width: 92px; border: 1px solid #AAB6BD; border-radius: 8px; background: var(--white); padding: 0 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button {
  min-height: 46px; border-radius: 6px; border: 1px solid #AAB6BD; background: var(--white); font-weight: 600; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.seg button::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.seg button[aria-pressed="true"] { border-width: 2px; }
.seg button.st-ok[aria-pressed="true"] { background: #E5F3EA; border-color: var(--ok); }
.seg button.st-low[aria-pressed="true"] { background: #FBF0D6; border-color: var(--low); }
.seg button.st-out[aria-pressed="true"] { background: #F8E3E1; border-color: var(--out); }
.seg button.st-order[aria-pressed="true"] { background: #E3EBF8; border-color: var(--order); }
.seg button.st-nc[aria-pressed="true"] { background: #EEF1F2; border-color: var(--nc); }
.hint { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

/* ---------- bottom sheets, dialogs, toast ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-back { position: absolute; inset: 0; background: rgba(20,32,40,.45); animation: fade .2s; }
.sheet {
  position: relative; background: var(--white); border-radius: 12px 12px 0 0; max-height: calc(100% - 36px);
  display: flex; flex-direction: column; animation: up .24s cubic-bezier(.2,.7,.2,1); width: 100%; max-width: 760px; margin: 0 auto;
}
.sheet::before { content: ''; width: 40px; height: 4px; border-radius: 2px; background: #C3CCD1; position: absolute; top: 7px; left: 50%; margin-left: -20px; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.sheet-head .t { flex: 1; min-width: 0; }
.sheet-head h2 { margin: 6px 0 0; font-size: 19px; line-height: 1.25; font-weight: 600; }
.sheet-head .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 12px; flex: 1; }
.sheet-body.pad { padding: 14px 16px 16px; }
.sheet-foot { padding: 10px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.sheet-foot .btn { flex: 1; }
.part-title { font-size: 21px; line-height: 1.25; margin: 4px 0 6px; font-weight: 600; overflow-wrap: anywhere; }
.pn-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 17px; }
.pn-line .pn { font-weight: 700; letter-spacing: .01em; overflow-wrap: anywhere; }
.link { color: var(--panel-2); font-weight: 600; text-decoration: underline; min-height: 36px; }
.block-gap { margin-top: 18px; }
.audit { font-size: 13.5px; color: var(--muted); margin-top: 18px; line-height: 1.5; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.dialog-wrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; }
.dialog { position: relative; background: var(--white); border-radius: 10px; padding: 20px; width: 100%; max-width: 420px; animation: up .2s; }
.dialog h3 { margin: 0 0 8px; font-size: 19px; }
.dialog p { margin: 0 0 6px; color: var(--muted); }
.dialog .row-btns { margin-top: 18px; }
.toast {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--tabbar) + var(--safe-b) + 12px); z-index: 80;
  background: var(--ink); color: var(--white); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  max-width: 560px; margin: 0 auto; animation: up .2s; font-size: 15px;
}
.toast span { flex: 1; }
.toast button { color: var(--tape); font-weight: 700; min-height: 36px; padding: 0 6px; }

/* ---------- records ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stats button { background: var(--white); padding: 12px 10px; text-align: left; min-height: 72px; }
.stats b { display: block; font-family: var(--cond); font-size: 26px; line-height: 1.1; }
.stats span { font-size: 13.5px; color: var(--muted); }
.panel-box { background: var(--white); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.panel-box p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.act-list .item { grid-template-columns: 4px 1fr; }
.act-list .when { font-size: 13px; color: var(--muted); }
.toggle { display: flex; gap: 0; border: 1px solid #AAB6BD; border-radius: 6px; overflow: hidden; }
.toggle button { flex: 1; min-height: 44px; background: var(--white); font-weight: 500; }
.toggle button[aria-pressed="true"] { background: var(--panel); color: var(--white); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Google Sheets edition ---------- */
a.btn { text-decoration: none; color: inherit; }
.syncbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 90; pointer-events: none; opacity: 0; transition: opacity .2s; overflow: hidden; }
.syncbar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--tape); animation: slide 1.1s ease-in-out infinite; }
body.busy .syncbar { opacity: 1; }
@keyframes slide { from { left: -35%; } to { left: 100%; } }
.syncbtn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border-radius: 20px;
  color: #CFE0EA; font-size: 14px; font-weight: 500; border: 1px solid rgba(255,255,255,.22);
}
.syncbtn svg { width: 18px; height: 18px; }
body.busy .syncbtn svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner {
  display: flex; align-items: center; gap: 12px; background: #FBF0D6; border-bottom: 1px solid #E8CF6B;
  padding: 10px 16px; font-size: 14.5px; color: #4A3A00;
}
.banner span { flex: 1; }
.banner button { font-weight: 700; text-decoration: underline; min-height: 40px; padding: 0 6px; }
.conn { margin: 0 0 12px !important; color: var(--ink) !important; }
.hero-tape { background: var(--white); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.hero-tape p { margin: 10px 0 0; color: var(--muted); }
body.connect-mode .tabbar { display: none; }
body.connect-mode #view { padding-bottom: 24px; }

    S.parts.forEach(function (p) {
      if (SQ.status && p.status !== SQ.status) return;
      if (SQ.rack && p.rack !== SQ.rack) return;
      if (!tokens.length) { out.push({ p: p, s: 0 }); return; }
      var pnc = compact(p.pn);
      var score = 0;
      if (pnc && cq && pnc === cq) score = 100;
      else if (pnc && cq.length >= 3 && pnc.indexOf(cq) === 0) score = 70;
      else if (pnc && cq.length >= 3 && pnc.indexOf(cq) >= 0) score = 55;
      else {
        var hay = norm(p.desc + ' ' + p.pn + ' ' + p.model + ' ' + p.remarks + ' ' + locCode(p));
        if (tokens.every(function (t) { return hay.indexOf(t) >= 0; })) score = 30 + (norm(p.desc).indexOf(tokens[0]) === 0 ? 5 : 0);
        else if (cq.length >= 4 && compact(p.desc + ' ' + p.pn).indexOf(cq) >= 0) score = 25;

  function restockText() {

  function pickCol(head, names) {
    for (var i = 0; i < head.length; i++) {
      var h = norm(head[i]).replace(/[^a-z]/g, '');
      if (names.indexOf(h) >= 0) return i;
    }
    return -1;
  }
  function parseImport(u8) {
    var wb = XLSXLite.read(u8);
    var name = wb.names.indexOf('Parts') >= 0 ? 'Parts' : wb.names[0];
    var rows = wb.rows(name);
    var hi = -1;
    for (var i = 0; i < Math.min(rows.length, 15); i++) {
      var h = (rows[i] || []).map(function (x) { return norm(x).replace(/[^a-z]/g, ''); });
      if (h.indexOf('rack') >= 0 && (h.indexOf('description') >= 0 || h.indexOf('item') >= 0)) { hi = i; break; }
    }
    if (hi < 0) throw new Error('Could not find the header row. The sheet needs at least "Rack", "Level" and "Description" columns, like the file this app exports.');
    var head = rows[hi];
    var col = {
      id: pickCol(head, ['id']), rack: pickCol(head, ['rack']), level: pickCol(head, ['level']), box: pickCol(head, ['box']),
      comp: pickCol(head, ['compartment', 'comp']), model: pickCol(head, ['mcmodel', 'model', 'machine']),
      desc: pickCol(head, ['description', 'item', 'itemdescription']), pn: pickCol(head, ['partno', 'partnumber', 'pn']),
      qty: pickCol(head, ['qty', 'quantity']), unit: pickCol(head, ['unit']), min: pickCol(head, ['reorderat', 'minqty', 'min']),
      status: pickCol(head, ['availability', 'status']), remarks: pickCol(head, ['remarks', 'remark', 'notes'])
    };
    var get = function (r, k) { return col[k] >= 0 ? r[col[k]] : null; };
    var ok = [], skipped = 0;
    rows.slice(hi + 1).forEach(function (r) {
      if (!r || !r.length) return;
      var rack = parseInt(get(r, 'rack'), 10);
      var level = String(get(r, 'level') || '').trim().toUpperCase();
      var desc = String(get(r, 'desc') || '').trim();
      if (!rack || LEVELS.indexOf(level) < 0 || !desc) { if (desc || rack) skipped++; return; }
      var box = parseInt(get(r, 'box'), 10) || null;
      var comp = String(get(r, 'comp') || '').toLowerCase().replace(/[()\s]/g, '').replace('ⅰ', 'i').replace('ⅱ', 'ii').replace('ⅲ', 'iii').replace('ⅳ', 'iv');
      comp = COMPS.indexOf(comp) >= 0 ? comp : null;
      var qty = numOrNull(get(r, 'qty'));
      var min = numOrNull(get(r, 'min'));
      var st = String(get(r, 'status') || '').trim();
      var stMatch = STATUSES.filter(function (s) { return norm(s) === norm(st); })[0];
      ok.push({ id: String(get(r, 'id') || '').trim() || null, rack: rack, level: level, box: box, comp: comp,
        model: String(get(r, 'model') || '').trim(), desc: desc, pn: String(get(r, 'pn') == null ? '' : get(r, 'pn')).trim(),
        qty: qty, unit: String(get(r, 'unit') || '').trim() || 'Pcs', min: min,
        status: stMatch || suggestStatus(qty, min, null), remarks: String(get(r, 'remarks') || '').trim() });

    'more': function () { SQ.limit += 120; VIEWS.search.update(); },
    'goto-loc': function (d) {
      var r = Number(d.rack);
      go('rack', { rack: r, hl: d.box || boxesOf(r, d.level).length === 1 ? { rack: r, level: d.level, box: d.box ? Number(d.box) : (Number(boxesOf(r, d.level)[0]) || null) } : null });
    },
    'export': function () { exportXlsx(false); },
    'export-share': function () { exportXlsx(true); },
    'share-restock': function () {
      var t = restockText();
      if (!t) { toast('Nothing to restock. No parts are out of stock, low or on order.'); return; }
      shareText(t);
    },
    'import': function () { $('#importfile').click(); },
    'level-order': function (d) { S.settings.levelOrder = d.v; saveCfg(); render({ keepScroll: true }); },
    'sync': function () { sync(false); },
    'disconnect': function () {
      dialog(LOGIN_MODE ? 'Log out of this device?' : 'Disconnect this phone?',
        '<p>' + (LOGIN_MODE ? 'The offline copy of the list is removed from this device. The next person logs in with their own staff no.' : 'The saved link, key and offline copy are removed from this device.') + ' The Google Sheet is not changed.</p>', [
        { label: LOGIN_MODE ? 'Log out' : 'Disconnect', cls: 'primary', fn: logoutNow }, { label: 'Cancel' }]);
    },
    'dlg': function (d) { if (dialogResolve) dialogResolve(Number(d.i)); },
    'toast-action': function (d, el) { var t = el.closest('.toast'); var fn = t && t._fn; if (t) t.remove(); if (fn) fn(); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = A[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    fn(el.dataset, el, e);
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  });

  /* ================= boot ================= */
  function boot() {
    var cfg = lsGet(CFG_KEY) || {};
    S.settings = Object.assign({ name: '', levelOrder: 'top' }, cfg.settings || {});
    S.conn = Object.assign({ url: '', key: '', user: '' }, cfg.conn || {});
    if (LOGIN_MODE) {
      S.conn.url = HOSTED ? '' : WEB_APP_URL;
      if (!S.conn.user) S.conn.key = '';          // login mode: people log in by name, not with the key
    }
    var cache = lsGet(CACHE_KEY);
    if (cache && cache.parts) {
      S.parts = cache.parts;
      S.layout = cache.layout || {};
      S.log = cache.log || [];
      S.sync.at = cache.at || null;
      S.sync.sheetUrl = cache.sheetUrl || '';
      S.sync.sheetName = cache.sheetName || '';
    }
    view = $('#view');
    var bar = document.createElement('div');
    bar.className = 'syncbar';
    bar.setAttribute('aria-hidden', 'true');
    document.body.appendChild(bar);
    var tb = document.createElement('nav');
    tb.className = 'tabbar';
    tb.setAttribute('aria-label', 'Main');
    tb.innerHTML = [['racks', 'Racks', I.racks], ['search', 'Search', I.search], ['add', 'Add part', I.add], ['records', 'Records', I.records]].map(function (t) {
      return '<button data-act="tab" data-tab="' + t[0] + '">' + t[2] + '<span>' + t[1] + '</span></button>';
    }).join('');
    document.body.appendChild(tb);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && connected() && Date.now() - lastSync > 30000) sync(true);
    });
    setInterval(function () {
      if (document.visibilityState === 'visible' && connected() && Date.now() - lastSync > 110000) sync(true);
    }, 30000);
    if (!connected()) { nav.cur = { name: 'connect', params: {} }; render({}); return; }
    render({});
    sync(true);
  }
  window.__app = { state: function () { return S; }, sync: sync, locate: function (id) { locate(id); }, buildWorkbook: function () { return buildWorkbook(); } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
