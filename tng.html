<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#252525;font-family:system-ui,-apple-system,sans-serif}[hidden]{display:none!important}main{width:100%;max-width:490px;margin:auto}section{min-height:100vh;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #222;outline-offset:3px}.editor{padding:48px 22px}.editor h1{margin:0 0 8px}.editor p{color:#555;margin:0 0 24px}.editor label{display:block;margin:16px 0;font-weight:600}.editor input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #777;border-radius:10px;font-size:16px}.primary{border:0;border-radius:99px;background:#0864ed;color:white;min-height:48px;padding:9px 23px}.preview{display:flex;flex-direction:column}.hero{text-align:center;padding:clamp(36px,10svh,86px) 16px 0}.check{width:60px;height:60px;margin:auto;border-radius:50%;background:#09b850;color:#fff;display:grid;place-items:center}.check svg{width:32px;height:32px}.amount{margin:12px 0 5px;font-size:clamp(29px,8vw,41px);line-height:1.2;overflow-wrap:anywhere}.status{margin:0;color:#5f6368;font-size:17px}.tag{display:inline-block;margin-top:10px;background:#eef5ff;color:#184779;border-radius:5px;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.04em}.details{margin:26px 20px 0;display:grid;grid-template-columns:minmax(92px,1fr) minmax(0,1.5fr);gap:17px 12px;align-items:center;font-size:clamp(14px,4vw,17px)}dt{color:#626262}dd{margin:0;text-align:right;overflow-wrap:anywhere;font-weight:550}.sample{position:relative;margin:28px 16px 22px;padding:20px 44px 20px 18px;min-height:104px;border-radius:13px;background:#edf5ff;color:#183c68}.sample strong{display:block;margin-bottom:5px}.sample p{margin:0;font-size:14px;line-height:1.45}.close{position:absolute;right:7px;top:7px;width:36px;height:36px;border:0;background:transparent;color:#183c68;font-size:23px}.footer{margin-top:auto;display:flex;gap:12px;padding:16px 16px max(20px,env(safe-area-inset-bottom));box-shadow:0 -5px 17px #17273a0c}.footer .primary{flex:1;font-size:17px}.save{width:48px;min-height:48px;border:1px solid #0864ed;background:white;border-radius:50%;color:#0656d2;font-size:25px}.note{min-height:20px;margin:0 16px 8px;color:#184779;font-size:13px}

/* Phone-scale prototype, with a persistent simulation label. */
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.preview{min-height:100svh}.hero{padding:clamp(46px,9svh,96px) 16px 0}
.check{width:clamp(54px,15vw,70px);height:clamp(54px,15vw,70px);background:#0bd456}
.amount{font-weight:400;font-size:clamp(28px,8.2vw,43px);margin:15px 0 12px}.amount strong{font-weight:700}
.status{font-size:clamp(15px,4.1vw,21px);font-weight:500;color:#656565}
.tag{font-size:11px;margin-top:8px}.details{margin:26px 5.15% 0;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);row-gap:clamp(14px,2.6svh,26px);font-size:clamp(14px,4.05vw,20px)}
dt{color:#676767}dd{font-weight:550}
.sample{margin:25px 4.1% 18px;padding:0;min-height:0;background:white;color:#252525}
.banner-frame{aspect-ratio:868/454;border-radius:11px;overflow:hidden;background:#e9f2ff;display:grid;place-items:center;text-align:center;color:#184779;padding:16px}
.banner-frame:has(img:not([hidden])){padding:0}.banner-frame img{width:100%;height:100%;object-fit:contain;min-height:0}
.sample figcaption{margin-top:9px}.sample strong{font-size:15px}.sample p{font-size:13px}.close{z-index:1;background:#fff;border-radius:7px}
.footer{padding:16px 4.1% max(20px,env(safe-area-inset-bottom));gap:clamp(10px,3.7vw,18px)}.footer .primary{min-height:48px;font-size:17px}.save{flex:0 0 48px}
.editor input[type=file]{font-size:14px}.editor small{display:block;color:#555;margin-top:5px;font-weight:400}

.banner-frame[data-default="true"]{aspect-ratio:354/231;padding:0;background:#fff;border-radius:0}
.banner-frame #defaultBanner{display:block;width:100%;height:auto}
.sample:has([data-default="true"]) .close{top:1%;right:0;width:44px;height:44px;color:#06758f;background:#fff;font-weight:700;line-height:1}
</style></head><body><main>

HV/m+U45fs77MssWXvvgll6C554H1eOrMwfjJRmNjzqGhiab3ZOXryURP153I7P8B1NNbE9orZZoAAAAASUVORK5CYII="><img id="bannerImage" alt="Selected promotional banner" hidden></div><button type="button" id="close" class="close" aria-label="Dismiss banner">&times;</button></figure><p class="note" id="note" role="status"></p>
<footer class="footer"><button class="save" id="favorite" type="button" aria-label="Favorite this preview" aria-pressed="false">☆</button><button class="primary" id="done" type="button">Done</button></footer></section>
</main><script>
(() => {
 const $=id=>document.getElementById(id), amount=$('amount'), receiver=$('receiver');
 const currency=new Intl.NumberFormat('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
 let bannerURL;
 const bannerInput=$('bannerInput'), bannerImage=$('bannerImage');
 bannerInput.addEventListener('change',()=>{
  bannerInput.setCustomValidity('');
  if(bannerURL) URL.revokeObjectURL(bannerURL);
  bannerURL=undefined; bannerImage.removeAttribute('src'); bannerImage.hidden=true; $('defaultBanner').hidden=false; $('bannerFrame').dataset.default='true';
  const file=bannerInput.files[0];
  if(!file)return;
  if(!['image/png','image/jpeg','image/webp','image/avif'].includes(file.type)||file.size>15*1024*1024){bannerInput.setCustomValidity('Choose a PNG, JPEG, WebP or AVIF image under 15 MB.');bannerInput.reportValidity();return;}
  bannerURL=URL.createObjectURL(file); bannerImage.src=bannerURL;
 });
 bannerImage.addEventListener('load',()=>{bannerImage.hidden=false;$('defaultBanner').hidden=true;$('bannerFrame').dataset.default='false';});
 bannerImage.addEventListener('error',()=>{bannerImage.hidden=true;$('defaultBanner').hidden=false;$('bannerFrame').dataset.default='true';bannerInput.setCustomValidity('This image could not be opened. Choose another image.');});
 const pad=n=>String(n).padStart(2,'0');
 const timestamp=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
 for(const el of [amount,receiver]) el.addEventListener('input',()=>el.setCustomValidity(''));
 function showPreview(show){$('editor').hidden=show;$('preview').hidden=!show;window.scrollTo(0,0);(show?$('done'):receiver).focus({preventScroll:true});}
 $('form').addEventListener('submit',event=>{
  event.preventDefault();const value=amount.value.trim().replace(',','.');const name=receiver.value.trim();
  if(!/^\d{1,8}(?:\.\d{1,2})?$/.test(value)||Number(value)<=0){amount.setCustomValidity('Enter a positive amount with up to two decimal places.');amount.reportValidity();return;}
  if(!name){receiver.setCustomValidity('Enter a receiver name.');receiver.reportValidity();return;}
  $('outAmount').textContent=currency.format(Number(value));$('outName').textContent=name;$('outTime').textContent=timestamp(new Date());$('sample').hidden=false;showPreview(true);
 });
 $('done').addEventListener('click',()=>showPreview(false));
 $('close').addEventListener('click',()=>{$('sample').hidden=true;$('done').focus();});
 $('favorite').addEventListener('click',()=>{const button=$('favorite');const active=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(active));button.textContent=active?'★':'☆';$('note').textContent=active?'Favorited for this session.':'Favorite removed.';});
})();
</script></body></html>
